[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Required by openzeppelin-foundry-upgrades (storage-layout validation in the deploy script).
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./script/config" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 32

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[lint]
lint_on_build = false
